[project]
name = "clinical-assistant"
version = "0.1.0"
description = "Clinical Assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.84.0",
    "datasets>=3.6.0",
    "httpx>=0.28.1",
    "openai>=2.26.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "transformers>=4.56.2",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "rapidfuzz>=3.0.0",
    "scipy>=1.15.0",
    "sentence-transformers>=4.0.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
gpu = [
    "trl>=0.29.1",
    "unsloth>=2025.9.9",
    "unsloth-zoo>=2025.9.12",
]

[tool.uv]
package = true
